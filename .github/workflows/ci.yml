name: CI

# Build-only CI: lint, format-check, tests, and build the package.
# Publishing to PyPI + the GitHub Release happen on a version tag (v*) via
# publish.yml / release.yml, not here.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history for the version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (editable + dev extras)
        run: task install

      - name: Lint + format + type check (read-only)
        run: task verify

      # CI runs the UNIT suite only (house standard). The integration suite
      # supervises a real agent runtime (opencode) and is a LOCAL gate —
      # `task test:integration` / `task test:opencode`, run on a machine that
      # has opencode installed. CI has no opencode, so it must not run them.
      - name: Unit tests
        run: task test:unit

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sdist + wheel
        run: task build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
