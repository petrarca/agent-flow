[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI (namespaced — plain "agent-flow" is too similar to
# existing projects). The IMPORT name is unchanged: `import agent_flow`.
name = "petrarca-agent-flow"
authors = [
    { name = "Wolfgang Miller", email = "wolfgang.miller@petrarca-labs.com" },
]
description = "Deterministic orchestration of coding-agent pipelines (supervised subprocesses, DAG, bounded re-runs)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
# LEAN CORE. The default install is what you need to declare a pipeline and run
# it in-process on the default LocalBackend, with typed params/results and config
# (incl. YAML) — no execution-backend or display dependency:
#   - pydantic + pydantic-settings: typed agent `result` payloads AND the typed
#     run-parameters / RunConfig model (declared, required-checked, validated).
#     pydantic-settings also provides the YAML config source.
#   - pyyaml: parse a --config / build_run_config(config_file=...) YAML file — a
#     public (non-CLI) capability, so it stays core.
#   - python-dotenv: .env loading. jsonschema: plain-dict result-schema validation.
#
# The heavy/optional pieces are EXTRAS, matching the runtime seams:
#   - [prefect]: the opt-in PrefectBackend (the default LocalBackend needs none).
#   - [cli]:     rich + typer for run_cli and the human-facing display helpers.
# A programmatic consumer of build_flow (LocalBackend) needs neither.
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Execution backend: the opt-in Prefect backend (--backend prefect). The default
# local backend is Prefect-free, so this is only needed for the run UI / scale.
prefect = ["prefect>=3.0.0"]
# CLI + human-facing display: the reusable run_cli and the rich-rendered live
# events / status tables. Not needed to drive build_flow programmatically.
cli = ["typer>=0.12", "rich>=13.0"]
# Convenience: everything a full interactive install wants.
all = ["prefect>=3.0.0", "typer>=0.12", "rich>=13.0"]
# Development tooling. Includes the runtime extras (prefect + cli) so `task
# install` yields a full dev env able to run the entire test suite (the
# integration suite exercises the Prefect backend; CLI tests need rich/typer).
dev = ["petrarca-agent-flow[all]", "ruff", "pytest", "pytest-cov", "pre-commit", "setuptools-scm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*)"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (default)",
    "integration: marks tests as integration tests",
]
testpaths = ["tests"]
addopts = ["-m unit", "--strict-markers"]
