[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI (namespaced — plain "agent-flow" is too similar to
# existing projects). The IMPORT name is unchanged: `import agent_flow`.
name = "petrarca-agent-flow"
authors = [
    { name = "Wolfgang Miller", email = "wolfgang.miller@petrarca-labs.com" },
]
description = "Deterministic orchestration of coding-agent pipelines (supervised subprocesses, DAG, bounded re-runs)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<4.0"
# Ship LICENSE and the Apache-2.0 NOTICE in the sdist/wheel .dist-info so the
# required attribution (License §4.d) travels with every distribution.
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
# LEAN CORE. The default install is what you need to declare a pipeline and run
# it in-process on the default InProcessBackend, with typed params/results and config
# (incl. YAML) — no execution-backend or display dependency:
#   - anyio: the async concurrency primitive the engine core runs on (task
#     groups, cancel scopes, async subprocess). Present transitively via many
#     hosts (Starlette/Prefect) but declared here as a first-class core dep.
#   - pydantic + pydantic-settings: typed agent `result` payloads AND the typed
#     run-parameters / RunConfig model (declared, required-checked, validated).
#     pydantic-settings also provides the YAML config source.
#   - pyyaml: parse a --config / build_run_config(config_file=...) YAML file — a
#     public (non-CLI) capability, so it stays core.
#   - python-dotenv: .env loading. jsonschema: plain-dict result-schema validation.
#   - universal-pathlib: a pathlib-compatible UPath over fsspec, so a run_dir can
#     be an in-memory `memory://` path (mock runs default to it — hermetic, no
#     disk) with the SAME Path API a local run_dir uses. Small, pure-python; the
#     drop-in compatibility is what keeps the FS seam to ~one call site.
#
# The heavy/optional pieces are EXTRAS, matching the runtime seams:
#   - [prefect]: the opt-in PrefectBackend (the default InProcessBackend needs none).
#   - [cli]:     rich + typer for run_cli and the human-facing display helpers.
# A programmatic consumer of build_flow (InProcessBackend) needs neither.
dependencies = [
    "anyio>=4.0",
    "loguru>=0.7",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "universal-pathlib>=0.2",
]

[project.optional-dependencies]
# Execution backend: the opt-in Prefect backend (--backend prefect). The default
# in-process backend is Prefect-free, so this is only needed for the run UI / scale.
prefect = ["prefect>=3.0.0"]
# CLI + human-facing display: the reusable run_cli and the rich-rendered live
# events / status tables. Not needed to drive build_flow programmatically.
cli = ["typer>=0.12", "rich>=13.0"]
# Convenience: everything a full interactive install wants.
all = ["prefect>=3.0.0", "typer>=0.12", "rich>=13.0"]
# Development tooling. Includes the runtime extras (prefect + cli) so `task
# install` yields a full dev env able to run the entire test suite (the
# integration suite exercises the Prefect backend; CLI tests need rich/typer).
dev = ["petrarca-agent-flow[all]", "ruff", "mypy", "pytest", "pytest-cov", "pre-commit", "setuptools-scm", "import-linter"]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the inline-type marker so consumers' type checkers actually READ
# our annotations (without it they treat the package as untyped). Backed by mypy
# in `task verify` — the marker is a promise, the type check keeps it honest.
[tool.setuptools.package-data]
agent_flow = ["py.typed"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*)"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (default)",
    "integration: marks tests as integration tests",
    "anyio: marks async tests run via the anyio pytest plugin (asyncio backend)",
]
testpaths = ["tests"]
addopts = ["-m unit", "--strict-markers"]

[tool.mypy]
python_version = "3.14"
files = ["src/agent_flow"]
# The package ships inline types (PEP 561 py.typed), so annotations are part of
# the public contract — this keeps them honest. Third-party stubs are not
# required (several deps ship none), hence ignore_missing_imports.
ignore_missing_imports = true

# --- Architecture contracts (import-linter) ---------------------------------
# The layering is a build-failing constraint, not a convention. import-linter
# builds the import graph with grimp, which sees FUNCTION-LOCAL imports as well
# as module-level ones — the loophole that let three package cycles hide from a
# module-level-only guard.
#
# These run in the unit test suite (tests/unit/test_layering.py), NOT as a
# separate `task verify` step: `task fct` is the normal loop, so a violation
# fails where the change is made rather than after a push. Cycles and layering
# are "atomic, triggered" fitness functions in the Building Evolutionary
# Architectures taxonomy, which is the unit-test category, and the whole check
# costs ~0.1s. `lint-imports` still works standalone for ad-hoc use.
[tool.importlinter]
root_package = "agent_flow"

# Dependencies point one way. Highest layer first; a module may import anything
# BELOW it and nothing above. Modules sharing a line are the same rank.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "agent_flow.cli",
    "agent_flow.flowdef",
    "agent_flow.engine",
    "agent_flow.registry",
    "agent_flow.node_builder",
    "agent_flow.core | agent_flow.preflight",
    "agent_flow.runners | agent_flow.backends",
    "agent_flow.flow_types | agent_flow.run_config | agent_flow.utils",
    "agent_flow.protocol | agent_flow.gates | agent_flow.const | agent_flow.run_context",
]

# The tier rule, which layer rank cannot express: engine -> core is a DOWNWARD
# edge and still exactly what the rule forbids. allow_indirect_imports keeps this
# about DIRECT coupling — the engine legitimately reaches Tier 1 transitively
# through node_builder, which is the nominated bridge.
[[tool.importlinter.contracts]]
name = "Tier 3 must not import Tier 1"
type = "forbidden"
source_modules = ["agent_flow.engine"]
forbidden_modules = ["agent_flow.core", "agent_flow.runners"]
allow_indirect_imports = true

# A gate decides from what it is handed. Keeping it a leaf is what makes the
# tier rule true of Tier 3 generally, not just of the engine.
[[tool.importlinter.contracts]]
name = "Gates are a leaf"
type = "forbidden"
source_modules = ["agent_flow.gates"]
forbidden_modules = [
    "agent_flow.core",
    "agent_flow.runners",
    "agent_flow.engine",
    "agent_flow.backends",
    "agent_flow.node_builder",
    "agent_flow.registry",
]

# protocol is the shared leaf both core and runners depend on.
[[tool.importlinter.contracts]]
name = "protocol is a leaf"
type = "forbidden"
source_modules = ["agent_flow.protocol"]
forbidden_modules = ["agent_flow.core", "agent_flow.runners", "agent_flow.engine", "agent_flow.backends", "agent_flow.cli"]

# A backend depends on the flow vocabulary, never on the engine it is
# swappable for.
[[tool.importlinter.contracts]]
name = "Backends do not depend on the engine"
type = "forbidden"
source_modules = ["agent_flow.backends"]
forbidden_modules = ["agent_flow.engine"]

[[tool.importlinter.contracts]]
name = "No import cycles"
type = "acyclic_siblings"
ancestors = ["agent_flow"]
