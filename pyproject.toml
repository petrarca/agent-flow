[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flow"
authors = [
    { name = "Wolfgang Miller", email = "wolfgang.miller@petrarca-labs.com" },
]
description = "Deterministic orchestration of coding-agent pipelines (supervised subprocesses, DAG, bounded re-runs)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
# One dependency set. The core already hard-depends on Prefect (which dominates
# the install footprint by an order of magnitude), so keeping pydantic / typer /
# rich / pyyaml / jsonschema as separate extras earned nothing but optional-import
# branching. They are all first-class now:
#   - pydantic + pydantic-settings: typed agent `result` payloads AND the CLI's
#     typed run-parameters model (declared, required-checked, path-validated).
#   - typer + rich + pyyaml: the reusable run_cli (flags, --config, --param) and
#     human-facing output (live events, status tables).
#   - jsonschema: validation of plain-dict result schemas.
dependencies = [
    "prefect>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Only development tooling is optional now.
dev = ["ruff", "pytest", "pytest-cov", "pre-commit", "setuptools-scm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*)"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (default)",
    "integration: marks tests as integration tests",
]
testpaths = ["tests"]
addopts = ["-m unit", "--strict-markers"]
