# Prefect "mode 2": a persistent server + Postgres, for the dashboard + run history.
#
# This is the production-style deployment (vs. the sketch's ephemeral in-process
# server). Bring it up, point the flow at it via PREFECT_API_URL, and open the
# UI at http://localhost:4200 to see runs, task states, logs, and where a run hung.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   export PREFECT_API_URL=http://127.0.0.1:4200/api
#   PYTHONPATH=src uv run --with prefect python -m orchestrator.tech_flow --product X --runtime mock
#   open http://localhost:4200
#
# The flow still runs as a plain local script (we do NOT use workers/deployments);
# it just records to this server so the UI/history exist.

# Explicit project name so it shows as 'prefect-orchestrator' in `docker compose ls`
# regardless of the folder this file lives in (otherwise it defaults to 'deploy').
name: prefect-orchestrator

services:
  postgres:
    image: postgres:18
    container_name: prefect-postgres
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      # PG18 moved PGDATA to /var/lib/postgresql/18/docker (was .../data in PG<=17).
      - prefect-pgdata:/var/lib/postgresql
    ports:
      - "6543:5432"   # host 6543 -> container 5432 (avoid clashing with a local pg on 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    depends_on:
      postgres:
        condition: service_healthy
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      # Point the server at Postgres (the async driver URL Prefect expects).
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      # The API URL the UI advertises to browsers.
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"   # UI + API -> http://localhost:4200
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  prefect-pgdata:
